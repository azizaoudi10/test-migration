appId: com.fraktole.desktop
productName: Fraktole
executableName: fraktole-desktop
directories:
  output: release
files:
  - dist-electron/**
  - dist-renderer/**
  - package.json
  - build/icon.png
  - build/icon.ico
  # every prod dependency is bundled into dist-electron/main.cjs (esbuild)
  # or dist-renderer (vite) except the native node-pty — shipping the rest
  # of node_modules was ~12MB of dead weight (dev builds, .map files,
  # darwin/win32 prebuilds) that runtime code never resolves
  - '!node_modules/**'
  - node_modules/node-pty/**
  # the loader only consults build/Release, build/Debug and
  # prebuilds/<platform>-<arch>; sources, winpty sources, helper scripts and
  # test files are dead weight (foreign-platform prebuilds are dropped per
  # target below). On Windows build/Release carries conpty.node,
  # conpty_console_list.node, winpty.dll and winpty-agent.exe — kept.
  - '!node_modules/node-pty/src/**'
  - '!node_modules/node-pty/deps/**'
  - '!node_modules/node-pty/scripts/**'
  - '!node_modules/node-pty/bin/**'
  - '!node_modules/node-pty/**/*.test.*'
  # font files shipped as extra resources
  - src/assets/fonts/**
# 55 locale .pak files ship by default (~38MB unpacked); the UI is English
electronLanguages:
  - en-US
# static AppImage runtime: no libfuse.so.2 dependency (absent by default on
# modern Ubuntu); the generated AppRun already probes user namespaces and
# only passes --no-sandbox when they are unavailable
toolsets:
  appimage: 1.0.3
# node-pty spawns helper executables (winpty-agent.exe, conpty helpers) and
# loads .node addons by real path: neither works from inside app.asar
asarUnpack:
  - node_modules/node-pty/**
# Windows 10 1809+ / 11 (ConPTY). Code signing: set CSC_LINK / CSC_KEY_PASSWORD
# (or WIN_CSC_LINK) in the environment; unsigned builds work but trigger
# SmartScreen on first launch.
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.ico
  executableName: Fraktole
  artifactName: ${productName}-${version}-${arch}.${ext}
  files:
    - '!node_modules/node-pty/prebuilds/darwin-*/**'
    - '!node_modules/node-pty/prebuilds/linux-*/**'
    - '!node_modules/node-pty/prebuilds/win32-arm64/**'
    - '!node_modules/node-pty/**/*.pdb'
portable:
  artifactName: ${productName}-${version}-${arch}-portable.${ext}
nsis:
  oneClick: false
  # per-user by default (no admin prompt); the assisted installer still
  # offers "all users" with elevation
  perMachine: false
  allowElevation: true
  shortcutName: Fraktole
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
mac:
  target:
    - dmg
  icon: build/icon.png
  artifactName: ${productName}-${version}-${arch}.${ext}
  category: Development
  files:
    - '!node_modules/node-pty/prebuilds/linux-*/**'
    - '!node_modules/node-pty/prebuilds/win32-*/**'
  hardenedRuntime: true
  gatekeeperAssess: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
linux:
  target:
    - dir
    - AppImage
  files:
    - '!node_modules/node-pty/prebuilds/darwin-*/**'
    - '!node_modules/node-pty/prebuilds/win32-*/**'
  icon: build/icons
  category: Development
  maintainer: Fraktole
  artifactName: ${productName}-${version}-${arch}.${ext}
appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}
  # never force --no-sandbox from the desktop entry; AppRun decides
  executableArgs: []
extraResources:
  - src/assets/fonts/**
# (Linux only) installs the curated AppRun (GTK env sanitization + sandbox probe) over the
# generated one; see scripts/after-pack.cjs
afterPack: scripts/after-pack.cjs
# node-pty is rebuilt for the bundled Electron ABI at package time (Linux;
# `pnpm dist:win` passes -c.npmRebuild=false: the win32 N-API prebuilds are
# used as-is)
npmRebuild: true
